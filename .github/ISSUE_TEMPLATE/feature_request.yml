name: Feature request
description: Suggest something the app should do
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution. "I want to know X without doing Y" is more useful than "add a button".
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A sketch, a screenshot from another app, or a description of the interaction.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Optional. Helps judge how much the feature is worth.
